<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/traknus-app-180.png">
  <link rel="icon" href="icons/traknus-app.svg" type="image/svg+xml">
  <title>Traknus Lithium Simulator</title>
  <style>
    :root {
      --bg:#f3f6f6; --panel:#ffffff; --panel-soft:#f8faf9; --ink:#20313d;
      --muted:#6c7c84; --line:#dce5e4; --blue:#2268a7; --blue-soft:#e9f2f9;
      --red:#cf3740; --red-soft:#fbefef; --green:#347b65; --green-soft:#eaf4ef;
      --amber:#a96c20; --amber-soft:#fbf3e7; --shadow:0 10px 34px rgba(24,48,57,.065);
      --radius:20px;
    }
    [data-theme="dark"] {
      --bg:#111b21; --panel:#1a282f; --panel-soft:#202f37; --ink:#edf4f2;
      --muted:#acbdbd; --line:#34464e; --blue:#74b7eb; --blue-soft:#203b4e;
      --red:#f08085; --red-soft:#472d32; --green:#83c8a8; --green-soft:#263f37;
      --amber:#e1b469; --amber-soft:#44382b; --shadow:0 12px 34px rgba(0,0,0,.20);
    }
    * {box-sizing:border-box}
    body {margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Aptos,Arial,sans-serif}
    button,input,select {font:inherit}
    button {color:inherit}
    .shell {max-width:1280px;margin:auto;padding:22px 24px 54px}
    .topbar {display:flex;align-items:center;justify-content:space-between;gap:18px;margin:-22px -24px 18px;padding:16px 26px;background:var(--panel);border-bottom:1px solid var(--line)}
    .brand {display:flex;align-items:center;min-width:0}
    .logo-wrap {background:var(--panel);display:flex;align-items:center;justify-content:flex-start;width:220px;max-width:34vw;overflow:hidden}
    .logo {display:block;width:100%;height:auto}
    [data-theme="dark"] .logo-wrap {background:#fff;border-radius:10px;padding:5px 8px}
    [data-theme="dark"] .logo {mix-blend-mode:normal}
    .top-actions {display:flex;align-items:center;gap:9px}
    .quiet-btn,.lang-btn {border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 12px;font-weight:700;cursor:pointer}
    .quiet-btn:hover,.lang-btn:hover {border-color:var(--blue)}
    .language-switch {display:flex;align-items:center;gap:3px;border:1px solid var(--line);background:var(--panel-soft);border-radius:12px;padding:3px}
    .language-switch .lang-btn {border:0;background:transparent;border-radius:8px;min-width:40px;padding:6px 9px}
    .language-switch .lang-btn[aria-pressed="true"] {background:var(--blue);color:var(--panel)}
    .hero {display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:25px 28px;margin-bottom:20px;border-radius:24px;background:linear-gradient(117deg,#eaf1ee 0%,#e5eef1 54%,#edf1f7 100%);color:#20313d}
    [data-theme="dark"] .hero {background:linear-gradient(117deg,#20322f 0%,#20343c 54%,#293443 100%);color:var(--ink)}
    .hero-copy {max-width:720px}
    .eyebrow {font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#5d7881;margin-bottom:7px}
    [data-theme="dark"] .eyebrow {color:#abc6c6}
    .hero h1 {font-size:clamp(1.8rem,3.5vw,2.65rem);line-height:1.12;letter-spacing:-.035em;margin:0 0 9px}
    .hero p {margin:0;color:#526773;max-width:650px}
    [data-theme="dark"] .hero p {color:#cad8d8}
    .hero-badge {flex:0 0 auto;border:1px solid rgba(69,103,113,.2);background:rgba(255,255,255,.58);padding:10px 14px;border-radius:14px;font-weight:800;color:#405c67;font-size:.9rem}

    /* Traknus red-and-navy hero with a real forklift photo */
    .hero {position:relative;overflow:hidden;align-items:center;justify-content:center;gap:12px;text-align:left;min-height:214px;padding:20px 30px;background:linear-gradient(112deg,#111e4d 0%,#233c78 61%,#d71927 61%,#c51424 100%);color:#fff}
    .hero:after {content:"";position:absolute;right:29%;top:-28%;width:20%;height:160%;background:rgba(255,255,255,.08);transform:skewX(-34deg);pointer-events:none}
    [data-theme="dark"] .hero {background:linear-gradient(112deg,#111e4d 0%,#233c78 61%,#d71927 61%,#c51424 100%);color:#fff}
    .hero-copy {position:relative;z-index:1;width:min(60%,700px);max-width:700px;flex:0 1 700px;text-align:left;margin-left:-32px}
    .hero h1 {color:#fff;font-size:clamp(2.2rem,4.5vw,3.5rem);letter-spacing:0}
    .hero p,[data-theme="dark"] .hero p {color:#e0e8fa}
    @media (min-width:900px) { .hero h1 {white-space:nowrap;font-size:clamp(2.2rem,4.2vw,3.35rem)} }
    .hero-machine {position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:min(40%,420px);height:190px;justify-content:flex-end;padding:0;background:transparent;border-radius:0;box-shadow:none}
    .hero-forklift {display:block;width:100%;height:100%;object-fit:contain}
    .customer-block {margin:22px 0 18px;padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--panel-soft)}
    .customer-block h3 {margin:0 0 4px}
    .customer-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:13px}
    .customer-grid .field {min-width:0}
    .customer-error {color:#ad272f;font-weight:700;margin-top:10px}
    .type-card {min-height:118px}
    .truck-photo-wrap {display:flex;align-items:center;justify-content:center;flex:0 0 112px;width:112px;height:86px;overflow:visible;border-radius:0;background:transparent}
    .truck-photo {width:100%;height:100%;object-fit:contain}
    @media (min-width:900px) {
      body {font-size:18px}
      .sub,.type-detail,.field label,.small,.print-hint,.chart-caption {font-size:1.02rem}
      .panel h2 {font-size:1.28rem}
      .panel h3,.section-title {font-size:1.08rem}
    }
    @media (max-width:760px) {
      .hero {flex-direction:row;align-items:center;padding:19px;min-height:184px;gap:12px}
      .hero-copy {max-width:62%;margin-left:0}
      .hero-machine {width:38%;height:132px;padding:0}
      .customer-grid {grid-template-columns:1fr}
      .type-card {min-height:102px}
      .truck-photo-wrap {flex-basis:83px;width:83px;height:70px}
    }
    @media (max-width:480px) {
      .hero {padding:15px;gap:8px;min-height:158px}
      .hero h1 {font-size:1.7rem}
      .hero p {font-size:.84rem}
      .hero-machine {height:106px;width:36%}
      .type-card {padding:9px;gap:9px}
      .truck-photo-wrap {flex-basis:72px;width:72px;height:64px}
    }
    [data-theme="dark"] .hero-badge {background:rgba(255,255,255,.07);color:#d8e4e4;border-color:var(--line)}
    .progress {display:flex;align-items:center;gap:8px;margin:0 0 18px;color:var(--muted);font-size:.9rem;font-weight:700}
    .progress .step {display:flex;align-items:center;gap:8px}
    .step-num {width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);font-size:.78rem}
    .step.active {color:var(--ink)} .step.active .step-num {background:var(--blue);color:#fff}
    .progress-line {height:1px;width:38px;background:var(--line)}
    .panel {background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:17px}
    .panel-head {display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
    .panel h2 {font-size:1.2rem;line-height:1.25;margin:0 0 5px;letter-spacing:-.02em}
    .panel h3 {font-size:1rem;margin:0 0 7px}
    .sub {color:var(--muted);font-size:.92rem;margin:0}
    .eyebrow-small {font-size:.72rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
    .section-title {font-size:1.03rem;font-weight:800;margin:0 0 4px}
    .type-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .type-card {text-align:left;border:1px solid var(--line);background:var(--panel-soft);border-radius:17px;padding:15px;cursor:pointer;transition:.16s ease;display:flex;align-items:center;gap:15px;min-height:105px}
    .type-card:hover {transform:translateY(-1px);border-color:var(--blue);box-shadow:0 8px 20px rgba(34,104,167,.08)}
    .type-card.selected.cb {border:2px solid var(--red);background:var(--red-soft)}
    .type-card.selected.wh {border:2px solid var(--blue);background:var(--blue-soft)}
    .truck-icon {width:88px;height:66px;flex:0 0 auto}
    .type-label {display:block;font-weight:850;font-size:1.1rem}
    .type-detail {display:block;font-size:.84rem;color:var(--muted);margin-top:3px}
    .inline-note {padding:12px 14px;background:var(--panel-soft);border:1px dashed var(--line);border-radius:13px;color:var(--muted);font-size:.9rem}
    .choice-row {display:flex;flex-wrap:wrap;gap:9px}
    .choice {border:1px solid var(--line);background:var(--panel-soft);border-radius:12px;padding:10px 14px;min-height:43px;font-weight:750;cursor:pointer;transition:.14s ease}
    .choice:hover {border-color:var(--blue)}
    .choice.selected {border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
    .choice.selected.red {border-color:var(--red);background:var(--red-soft);color:var(--red)}
    .choice.selected.blue {border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
    .model-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
    .model-card {border:1px solid var(--line);background:var(--panel-soft);border-radius:12px;padding:9px 10px;text-align:center;font-weight:850;letter-spacing:.01em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:137px}
    .model-photo-wrap {display:flex;align-items:center;justify-content:center;width:100%;height:96px;background:transparent}
    .model-photo {display:block;width:100%;height:100%;object-fit:contain}
    .model-name {font-weight:850;line-height:1.15}
    .model-card:hover {border-color:var(--blue)}
    .model-card.selected {border:2px solid var(--blue);background:var(--blue-soft);color:var(--blue);padding:8px 9px}
    .truck-box {border-top:3px solid var(--unit-color,var(--red));padding-top:16px}
    .truck-box-head {display:flex;align-items:center;gap:10px;margin-bottom:15px}
    .truck-dot {height:13px;width:13px;border-radius:4px;background:var(--unit-color,var(--red));transform:rotate(45deg)}
    .truck-box-title {font-weight:850;font-size:1.06rem}
    .two-col {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .field-row {display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:end}
    .field label {display:block;font-size:.84rem;color:var(--muted);font-weight:750;margin-bottom:6px}
    .input {width:100%;border:1px solid var(--line);background:var(--panel-soft);color:var(--ink);border-radius:11px;padding:11px 12px;min-height:44px}
    input[type="time"] {min-width:130px}
    input[type="number"] {max-width:140px}
    .battery-label {font-size:.9rem;font-weight:800;margin:17px 0 8px}
    .caps {display:flex;flex-wrap:wrap;gap:9px}
    .cap {display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel-soft);border-radius:12px;padding:10px 13px;cursor:pointer;font-weight:800}
    .cap.selected {background:var(--green-soft);border-color:var(--green);color:var(--green)}
    .checkmark {width:17px;height:17px;border:1.5px solid currentColor;border-radius:5px;display:inline-grid;place-items:center;font-size:.7rem}
    .cap.selected .checkmark:after {content:"✓"}
    .mode-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .mode-card {min-height:74px;text-align:left;border:1px solid var(--line);background:var(--panel-soft);border-radius:13px;padding:10px;cursor:pointer}
    .mode-card strong {display:block;font-size:.9rem}
    .mode-card span {font-size:.77rem;color:var(--muted)}
    .mode-card.selected {border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
    .mode-card.selected span {color:var(--blue)}
    .separator {height:1px;background:var(--line);margin:18px 0}
    .schedule-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .schedule-controls {display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:15px}
    .count-control {display:flex;align-items:center;gap:8px}
    .count-control input {width:88px;text-align:center;font-weight:850}
    .count-control .small-btn {height:44px;min-width:42px;font-size:1.1rem}
    .shift-card {border:1px solid var(--line);background:var(--panel-soft);border-radius:15px;padding:15px}
    .shift-card-head {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .shift-name {font-weight:850}
    .break-section {border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
    .break-section-title {font-size:.9rem;font-weight:850;margin-bottom:2px}
    .break-list {display:grid;gap:9px;margin-top:8px}
    .break-row {border-top:1px solid var(--line);padding-top:10px}
    .break-label {font-size:.78rem;color:var(--muted);font-weight:800;margin-bottom:7px}
    .break-controls {display:grid;grid-template-columns:1fr .8fr auto;gap:8px;align-items:end}
    .charge-toggle {display:flex;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:3px;height:44px}
    .charge-toggle button {border:0;border-radius:7px;background:transparent;padding:0 10px;font-weight:750;color:var(--muted);cursor:pointer}
    .charge-toggle button.selected {background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 2px var(--green);font-weight:850}
    .small-btn {border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;font-size:.82rem;font-weight:750;cursor:pointer}
    .small-btn:hover {border-color:var(--blue)}
    .primary,.secondary {border:0;border-radius:13px;padding:13px 18px;font-weight:850;cursor:pointer;transition:.15s ease}
    .primary {background:var(--red);color:white;box-shadow:0 8px 18px rgba(207,55,64,.16)}
    .primary:hover {filter:brightness(.95);transform:translateY(-1px)}
    .secondary {background:var(--panel-soft);border:1px solid var(--line);color:var(--ink)}
    .secondary:hover {border-color:var(--blue)}
    .add-truck-btn {background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
    .add-truck-btn:hover {background:var(--blue-soft);border-color:var(--blue);box-shadow:0 6px 16px rgba(34,104,167,.12);transform:translateY(-1px)}
    .add-truck-btn:disabled {opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
    .welcome-panel {padding:clamp(22px,4vw,38px)}
    .welcome-title {font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.2;letter-spacing:-.03em;margin:0 0 9px}
    .welcome-steps {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}
    .welcome-step {border:1px solid var(--line);background:var(--panel-soft);border-radius:15px;padding:15px}
    .welcome-step-number {display:grid;place-items:center;width:32px;height:32px;line-height:1;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:900;margin-bottom:9px}
    .welcome-step strong {display:block;margin-bottom:3px}
    .welcome-step > span:not(.welcome-step-number) {display:block;color:var(--muted);font-size:.88rem}
    .share-icon {width:18px;height:18px;vertical-align:-4px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:6px}
    .print-hint {color:var(--muted);font-size:.84rem;margin-top:7px}
    .button-row {display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:11px;margin-top:17px}
    .button-group {display:flex;gap:9px;flex-wrap:wrap}
    .error {color:#ad272f;font-weight:700;margin-top:9px}
    .conditions {display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
    .condition-box {border:1px solid var(--line);border-radius:15px;padding:16px;background:var(--panel-soft)}
    .condition-box h3 {margin-bottom:4px}
    .condition-box .choice-row {margin-top:12px}
    .info-pill {display:inline-flex;align-items:center;gap:7px;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:7px 11px;font-size:.82rem;font-weight:800}
    .stat-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));align-items:start;gap:8px;margin:8px 0}
    .stat {background:var(--panel-soft);border:1px solid var(--line);border-radius:14px;padding:11px 12px;align-self:start}
    .stat-label {color:var(--muted);font-weight:750;font-size:.78rem;text-transform:uppercase;letter-spacing:.055em}
    .stat-value {font-size:1.35rem;font-weight:900;letter-spacing:-.025em;line-height:1.22;margin-top:3px}
    .viz-filter-head {margin:14px 0 8px;font-weight:800;color:var(--ink)} .viz-filter-list {display:flex;flex-wrap:wrap;gap:9px;margin:0 0 10px} .viz-result-option {display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:7px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-soft);cursor:pointer;color:var(--ink)} .viz-result-option:has(input:checked) {border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)} .viz-result-option input {width:17px;height:17px;accent-color:var(--blue);margin:0} .viz-result-option span {display:inline-flex;align-items:center;gap:7px} .viz-line-swatch {width:22px;height:0;border-top:3px solid;display:inline-block;flex:none} .viz-truck-meta {display:flex;flex-direction:column;line-height:1.2} .viz-truck-meta strong {font-size:.9rem} .viz-truck-meta small {font-size:.76rem;color:var(--muted)} .viz-filter-help {margin:0 0 10px;color:var(--muted);font-size:.88rem} .chart-wrap {overflow-x:auto}
    .chart {display:block;width:100%;min-width:590px;height:auto;font-family:Aptos,Arial,sans-serif}
    .legend {display:flex;flex-wrap:wrap;gap:10px 16px;margin:12px 0 2px}
    .legend-item {display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.84rem;font-weight:750}
    .legend-line {width:22px;border-top:3px solid;border-radius:3px}
    .break-timeline {display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
    .break-timeline-title {width:100%;font-weight:800;font-size:.87rem}
    .break-time-chip {display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--panel-soft);font-size:.8rem;color:var(--ink)}
    .break-swatch {width:10px;height:10px;border-radius:3px;background:#929fa3;flex:0 0 auto}
    .break-time-chip.charging .break-swatch {background:#347b65}
    .print-chart .break-timeline {gap:5px;margin-top:6px;padding-top:6px}
    .print-chart .break-timeline-title {font-size:8.5pt}
    .print-chart .break-time-chip {font-size:8pt;padding:3px 7px}
    .chart-caption {color:var(--muted);font-size:.87rem;margin-top:9px}
    .dropdown-checks {position:relative;margin:8px 0 10px}
    .dropdown-checks summary {display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel-soft);font-weight:750;cursor:pointer}
    .dropdown-checks[open] summary {border-color:var(--blue);color:var(--blue)}
    .dropdown-options {position:absolute;z-index:20;top:calc(100% + 5px);left:0;min-width:220px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
    .dropdown-option {display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
    .dropdown-option:hover {background:var(--panel-soft)}
    .dropdown-option input {width:18px;height:18px;accent-color:var(--blue)}

    .alert-box {border:1px solid #e8caa0;background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:13px 15px;font-weight:750;margin-top:13px}
    .green-box {border:1px solid #b8d8c8;background:var(--green-soft);color:var(--green);border-radius:14px;padding:13px 15px;font-weight:750;margin-top:13px}
    .schedule-strip {display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
    .schedule-chip {border-radius:999px;background:var(--panel-soft);border:1px solid var(--line);padding:6px 10px;font-size:.8rem;color:var(--muted);font-weight:750}
    .report-table-wrap {overflow-x:auto;margin-top:10px}
    .report-table {width:100%;border-collapse:collapse;font-size:.84rem}
    .report-table th,.report-table td {border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
    .report-table th {background:var(--panel-soft);font-weight:850;white-space:nowrap}
    .footer {text-align:center;color:var(--muted);font-size:.85rem;padding:22px 8px 0}
    .footer strong {color:var(--ink)}
    .hidden {display:none!important}
    .print-only {display:none}
    .print-report {display:none}
    @media (max-width:760px) {
      .shell {padding:15px 13px 40px}
      .topbar {align-items:flex-start;margin:-15px -13px 16px;padding:13px 16px}
      .logo-wrap {width:165px;max-width:42vw}
      .top-actions {flex-wrap:wrap;justify-content:flex-end;gap:6px}
      .quiet-btn,.lang-btn {padding:8px 9px;font-size:.86rem}

  <script>

    function removeLogoBackground() {
      var img=document.querySelector(".logo");
      function cutout() {
        if(img.dataset.cutout==="done"||!img.naturalWidth)return;
        try {
          var canvas=document.createElement("canvas");
          canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
          var ctx=canvas.getContext("2d",{willReadFrequently:true});
          ctx.drawImage(img,0,0);
          var pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
          for(var i=0;i<pixels.data.length;i+=4){
            var r=pixels.data[i],g=pixels.data[i+1],b=pixels.data[i+2];
            if(Math.min(r,g,b)>244&&Math.max(r,g,b)-Math.min(r,g,b)<14)pixels.data[i+3]=0;
          }
          ctx.putImageData(pixels,0,0);
          img.dataset.cutout="done";
          img.src=canvas.toDataURL("image/png");
        } catch(e) {
          img.dataset.cutout="unavailable";
        }
      }
      if(img.complete)cutout();else img.addEventListener("load",cutout,{once:true});

    function ensureSchedule() {

    function simulate(config,battery) {
      var t=config.truck,spec=config.spec;
      var usable=battery.ah*(1-(battery.reserve_pct||0));
      var modeFactor=Number((spec.power_modes||{})[t.mode]||1);
      var intensityFactor=Number(CATALOG.intensity_factors[selectedIntensity(t)]);
      var draw=spec.en_ah_per_hour*modeFactor*intensityFactor*liftFactorFor(t,spec);
      var charger=Number(t.charger===null?((spec.charger_options_a||[])[0]||0):t.charger);
      var chargeRate=Math.min(Number(battery.ah),charger)*Number(CATALOG.charge_efficiency||1);
      var windows=[];
      for(var i=0;i<state.shiftCount;i++) {
        var start=shiftStart(i);
        var end=start+shiftLength(i)*60;
        windows.push({start:start,end:end,shift:i});
      }
      var first=windows[0].start,last=windows.reduce(function(a,w){return Math.max(a,w.end);},0),step=Number(CATALOG.time_step_min||5);
      var breaks=[];
      for(var si=0;si<windows.length;si++) {
        var w=windows[si];
        state.breaks[si].forEach(function(b,j){
          var bs=breakStart(si,j);
          while(bs<w.start) bs+=1440;
          var len=Number(b.length||0);
          if(len>0) breaks.push({start:bs,end:bs+len,charge:!!b.charge});
        });
      }
      var timeline=[first];
      for(var m=first+step;m<last;m+=step) timeline.push(m);
      if(timeline[timeline.length-1]<last) timeline.push(last);
      var soc=usable,points=[];
      for(var p=0;p<timeline.length;p++) {
        var minute=timeline[p];
        if(p>0) {
          var pm=timeline[p-1],elapsed=(minute-pm)/60;
          var working=windows.some(function(w){return w.start<=pm&&pm<w.end;});
          var br=null;
          for(var bi=0;bi<breaks.length;bi++) if(breaks[bi].start<=pm&&pm<breaks[bi].end){br=breaks[bi];break;}
          if(working&&br===null) soc-=draw*elapsed;
          else if(working&&br&&br.charge&&chargeRate>0) soc+=chargeRate*elapsed;
          soc=Math.max(0,Math.min(usable,soc));
        }
        points.push({elapsed:(minute-first)/60,clock:fmtClock(minute),soc:usable?soc/usable*100:0,minute:minute});
      }
      var min=points.reduce(function(a,p){return Math.min(a,p.soc);},100),end=points[points.length-1].soc;
      var threshold=Number(CATALOG.soft_safety_pct||.10)*100;
      var soft=points.find(function(p){return p.soc<=threshold;});
      return {label:t.name+" · "+spec.model+" · "+fmtNum(battery.ah)+" Ah",truckName:t.name,model:spec.model,truckType:t.type,points:points,draw:draw,usable:usable,runtime:draw?usable/draw:0,min:min,end:end,chargeRate:chargeRate,threshold:threshold,soft:soft?soft.elapsed:null,depleted:min<=.01,battery:battery,index:config.index};
    }
    function chartSvg(results,forPrint) {
      var W=840,H=372,L=72,R=20,T=18,B=60,iw=W-L-R,ih=H-T-B;
      var max=0;
      for(var i=0;i<results.length;i++) max=Math.max(max,results[i].points[results[i].points.length-1].elapsed);
      max=Math.max(max,.25);
      var x=function(v){return L+iw*v/max;}, y=function(v){return T+ih*(100-v)/100;};
      var ink=forPrint?"#586a73":getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
      var line=forPrint?"#d8e0e0":getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
      var parts=['<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+tr("Grafik persentase sisa baterai sepanjang jadwal","Battery remaining percentage over the work schedule")+'">'];
      ensureSchedule();
      var base=shiftStart(0);
      for(var si=0;si<state.shiftCount;si++) state.breaks[si].forEach(function(b,j){
        var start=breakStart(si,j);
        while(start<shiftStart(si)) start+=1440;
        var elapsed=(start-base)/60,duration=Number(b.length||0)/60,end=elapsed+duration;
        if(duration<=0||end<=0||elapsed>=max)return;
        var x0=x(Math.max(0,elapsed)),x1=x(Math.min(max,end));
        if(x1-x0<1)return;
        var fill=b.charge?"#347b65":"#929fa3";
        var title=tr("Shift ","Shift ")+(si+1)+" · "+fmtClock(start)+"–"+fmtClock(start+Number(b.length||0))+" · "+(b.charge?tr("charging","charging"):tr("tidak charging","not charging"));
        parts.push('<g><title>'+esc(title)+'</title><rect x="'+x0.toFixed(1)+'" y="'+T+'" width="'+(x1-x0).toFixed(1)+'" height="'+ih+'" rx="3" fill="'+fill+'" opacity=".28" stroke="'+fill+'" stroke-width="1.4" stroke-opacity=".75"/></g>');
      });
      parts.push('<rect x="'+L+'" y="'+y(10).toFixed(1)+'" width="'+iw+'" height="'+(y(0)-y(10)).toFixed(1)+'" fill="#e54855" opacity=".16"/>');
      for(var v=0;v<=100;v++){
        var major=v%10===0,medium=v%5===0,yy=y(v),tick=major?8:medium?6:3;
        if(major)parts.push('<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="'+line+'" stroke-width="1" opacity=".72"/>');
        parts.push('<line x1="'+(L-tick)+'" y1="'+yy+'" x2="'+L+'" y2="'+yy+'" stroke="'+ink+'" stroke-width="'+(major?1.2:medium?.9:.65)+'" opacity="'+(major?".9":medium?".65":".42")+'"/>');
        if(major)parts.push('<text x="'+(L-11)+'" y="'+(yy+3.5)+'" text-anchor="end" fill="'+ink+'" font-size="11">'+v+'%</text>');
      }
      parts.push('<text x="'+(L+10)+'" y="'+(y(5)+4)+'" fill="#9f2630" font-size="12" font-style="italic" font-weight="700">'+tr("Area tidak direkomendasikan","Not recommended area")+'</text>');
      var wholeHours=Math.floor(max+1e-9),fractionalEnd=max-wholeHours>1e-6;
      var tightEnd=fractionalEnd&&x(max)-x(wholeHours)<44;
      for(var hour=0;hour<=wholeHours;hour++){
        var ev=hour,clock=fmtClock(base+ev*60),labelY=tightEnd&&hour===wholeHours?H-31:H-17;
        parts.push('<line x1="'+x(ev)+'" y1="'+T+'" x2="'+x(ev)+'" y2="'+(H-B)+'" stroke="'+line+'" stroke-width="1" opacity=".42"/><line x1="'+x(ev)+'" y1="'+(H-B)+'" x2="'+x(ev)+'" y2="'+(H-B+6)+'" stroke="'+ink+'" stroke-width="1" opacity=".8"/><text x="'+x(ev)+'" y="'+labelY+'" text-anchor="middle" fill="'+ink+'" font-size="10">'+clock+'</text>');
      }
      for(var minuteTick=15;minuteTick<max*60;minuteTick+=15){
        if(minuteTick%60===0)continue;
        var tickX=x(minuteTick/60),tickLen=minuteTick%30===0?5:3;
        parts.push('<line x1="'+tickX+'" y1="'+(H-B)+'" x2="'+tickX+'" y2="'+(H-B+tickLen)+'" stroke="'+ink+'" stroke-width=".7" opacity=".48"/>');
      }
      if(fractionalEnd){
        var endClock=fmtClock(base+max*60);
        parts.push('<line x1="'+x(max)+'" y1="'+T+'" x2="'+x(max)+'" y2="'+(H-B)+'" stroke="'+line+'" stroke-width="1" opacity=".58"/><text x="'+x(max)+'" y="'+(H-17)+'" text-anchor="middle" fill="'+ink+'" font-size="10">'+endClock+'</text>');
      }
      parts.push('<text x="18" y="'+(T+ih/2)+'" transform="rotate(-90 18 '+(T+ih/2)+')" text-anchor="middle" fill="'+ink+'" font-size="11" font-weight="700">'+tr("State of charge (SOC) · sisa baterai","State of charge (SOC) · battery remaining")+'</text>');
      parts.push('<text x="'+(L+iw/2)+'" y="'+(H-4)+'" text-anchor="middle" fill="'+ink+'" font-size="11" font-weight="700">'+tr("Waktu","Time")+'</text>');
      results.forEach(function(r,idx){
        var color=resultColor(r),d=resultDash(r);
        var path=r.points.map(function(p,j){return (j?"L":"M")+x(p.elapsed).toFixed(1)+" "+y(p.soc).toFixed(1);}).join(" ");
        parts.push('<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" '+(d?'stroke-dasharray="'+d+'"':'')+'/>');
        var last=r.points[r.points.length-1];
        for(var hourMark=1;hourMark<max-1e-6;hourMark++){
          var hourlyPoint=r.points.find(function(p){return Math.abs(p.elapsed-hourMark)<1e-6;});
          if(hourlyPoint)parts.push('<circle cx="'+x(hourlyPoint.elapsed)+'" cy="'+y(hourlyPoint.soc)+'" r="2.7" fill="'+color+'" stroke="var(--panel)" stroke-width="1"/>');
        }
        parts.push('<circle cx="'+x(last.elapsed)+'" cy="'+y(last.soc)+'" r="4.5" fill="'+color+'" stroke="var(--panel)" stroke-width="2"/>');
      });
      parts.push('</svg>');
      return parts.join("");
    }

    function chartImageBlob() {
      return new Promise(function(resolve,reject){
        var original=document.querySelector(".chart-wrap .chart");
        if(!original){reject(new Error("Chart not found"));return;}
        var svg=original.cloneNode(true),vb=svg.viewBox.baseVal,width=vb.width||840,height=vb.height||372;
        var legend=Array.from(document.querySelectorAll(".legend-item")).map(function(item){
          var line=item.querySelector(".legend-line");
          return {label:item.textContent.trim(),color:line?getComputedStyle(line).borderTopColor:"#2268a7",style:line?getComputedStyle(line).borderTopStyle:"solid"};
        });
        var cols=2,rows=Math.ceil(legend.length/cols),legendTop=height+30,totalHeight=legendTop+rows*28+44;
        var bg=getComputedStyle(document.documentElement).getPropertyValue("--panel").trim()||"#fff",labelColor=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#20313d",mutedColor=getComputedStyle(document.documentElement).getPropertyValue("--muted").trim()||"#586a73";
        svg.setAttribute("xmlns","http://www.w3.org/2000/svg");
        svg.setAttribute("viewBox","0 0 "+width+" "+totalHeight);
        svg.setAttribute("width",String(width*2));svg.setAttribute("height",String(totalHeight*2));
        svg.setAttribute("style","font-family:Aptos,Arial,sans-serif");
        var ns="http://www.w3.org/2000/svg";
        function add(tag,attrs,text){
          var el=document.createElementNS(ns,tag);
          Object.keys(attrs).forEach(function(key){el.setAttribute(key,attrs[key]);});
          if(text)el.textContent=text;
          svg.appendChild(el);return el;
        }
        var back=document.createElementNS(ns,"rect");
        back.setAttribute("x","0");back.setAttribute("y","0");back.setAttribute("width",String(width));back.setAttribute("height",String(totalHeight));back.setAttribute("fill",bg);
        svg.insertBefore(back,svg.firstChild);
        legend.forEach(function(item,i){
          var col=Math.floor(i/rows),row=i%rows,x=22+col*(width/2),y=legendTop+row*28;
          add("line",{x1:x,y1:y,x2:x+28,y2:y,stroke:item.color,"stroke-width":"3.5","stroke-dasharray":item.style==="dashed"?"7 5":item.style==="dotted"?"2 5":""});
          add("text",{x:x+37,y:y+4,fill:labelColor,"font-size":"12", "font-family":"Aptos,Arial,sans-serif"},item.label);
        });
        add("text",{x:22,y:totalHeight-14,fill:mutedColor,"font-size":"11","font-family":"Aptos,Arial,sans-serif"},tr("Bagian berwarna menunjukkan istirahat; warna hijau menandai charging.","Shaded bands show breaks; green bands indicate charging."));
        var xml=new XMLSerializer().serializeToString(svg).replace(/var\(--panel\)/g,bg);
        var image=new Image(),url=URL.createObjectURL(new Blob([xml],{type:"image/svg+xml;charset=utf-8"}));
        image.onload=function(){
          try{
            var canvas=document.createElement("canvas"),scale=2;
            canvas.width=width*scale;canvas.height=totalHeight*scale;
            var ctx=canvas.getContext("2d");ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
            canvas.toBlob(function(blob){URL.revokeObjectURL(url);if(blob)resolve(blob);else reject(new Error("Could not create chart image"));},"image/png");
          }catch(error){URL.revokeObjectURL(url);reject(error);}
        };
        image.onerror=function(){URL.revokeObjectURL(url);reject(new Error("Could not render chart image"));};
        image.src=url;
      });
    }

      else if(act==="print"){window.print();return;}
      else if(act==="email-report"){emailReport();return;}
      else if(act==="analyze"){var err=validSetup();if(err){var existing=document.getElementById("formError");if(existing)existing.remove();b.insertAdjacentHTML("afterend",'<span id="formError" class="error">'+esc(err)+'</span>');return;}state.screen="analysis";}
      render();
    });
    app.addEventListener("input",function(e){
      var el=e.target;if(el.dataset.input==="customer"){state.customer[el.dataset.field]=el.value;state.customerError="";}
    });
    app.addEventListener("change",function(e){
      var el=e.target,input=el.dataset.input;if(!input)return;
      var slot=el.dataset.slot,t=slot?state.trucks[Number(slot.slice(1))-1]:null;
      if(input==="viz-result"){var key=String(el.dataset.index)+"|"+String(el.dataset.ah);if(!el.checked&&state.visualResultKeys.length<=1)state.visualResultKeys=[key];else state.visualResultKeys=el.checked?(state.visualResultKeys.indexOf(key)>=0?state.visualResultKeys:state.visualResultKeys.concat([key])):state.visualResultKeys.filter(function(item){return item!==key;});}
      else if(input==="truck-type"&&t){t.type=el.value||null;t.series=null;t.model=null;t.batteries=[];t.charger=null;t.mode="Standard";}
      else if(input==="truck-series"&&t){t.series=el.value||null;t.model=null;t.batteries=[];t.charger=null;}
      else if(input==="truck-model"&&t){t.model=el.value||null;if(t.model){var spec=CATALOG.models.find(function(m){return m.model===t.model;});t.batteries=(spec.battery_options||[]).map(function(x){return x.ah;});t.charger=(spec.charger_options_a||[])[0]||0;if(!Object.keys(spec.power_modes||{}).includes(t.mode))t.mode="Standard";}else t.batteries=[];}
      else if(input==="truck-battery"&&t){var ah=Number(el.dataset.value);t.batteries=el.checked?(t.batteries.indexOf(ah)>=0?t.batteries:t.batteries.concat([ah])):t.batteries.filter(function(x){return x!==ah;});}
      else if(input==="truck-mode"&&t)t.mode=el.value;
      
      else if(input==="shift-count")state.shiftCount=Math.max(1,Math.min(24,parseInt(el.value,10)||1));
      else if(input==="workday-hours")state.workdayHours=Math.max(1,Math.min(24,Number(el.value)||8));
      else if(input==="shift-start"){var si=Number(el.dataset.shift);state.shiftStarts[si]=el.value;if(si===0)state.firstStart=el.value;for(var j=si+1;j<state.shiftCount;j++)state.shiftStarts[j]=null;}
      else if(input==="break-time"){var si=Number(el.dataset.shift),bi=Number(el.dataset.break);state.breaks[si][bi].start=el.value;}
      else if(input==="break-length-preset"){var si=Number(el.dataset.shift),bi=Number(el.dataset.break);if(el.value==="custom")state.breaks[si][bi].customDuration=true;else{state.breaks[si][bi].length=Number(el.value);state.breaks[si][bi].customDuration=false;}}
      else if(input==="break-length"){var si=Number(el.dataset.shift),bi=Number(el.dataset.break);state.breaks[si][bi].length=Math.max(1,Math.min(1440,Number(el.value)||1));state.breaks[si][bi].customDuration=true;}
      render();
    });
    document.querySelectorAll(".language-switch [data-lang]").forEach(function(button){button.addEventListener("click",function(){state.lang=button.dataset.lang;localStorage.setItem("traknus-lang",state.lang);render();});});
    document.getElementById("themeButton").addEventListener("click",function(){state.theme=state.theme==="dark"?"light":"dark";render();});
    if("serviceWorker" in navigator) window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});
    removeLogoBackground();
    fetch("catalog.json").then(function(r){if(!r.ok)throw new Error("catalog");return r.json();}).then(function(data){CATALOG=data;render();}).catch(function(){app.innerHTML='<section class="panel"><h2>'+tr("Data katalog belum termuat.","Model catalog did not load.")+'</h2><p class="sub">catalog.json</p></section>';});
  </script>
</body>
</html>
