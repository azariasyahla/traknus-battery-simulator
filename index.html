  <style>
    :root {
      --bg:#f3f6f6; --panel:#ffffff; --panel-soft:#f8faf9; --ink:#20313d;
      --muted:#6c7c84; --line:#dce5e4; --blue:#2268a7; --blue-soft:#e9f2f9;
      --red:#cf3740; --red-soft:#fbefef; --green:#347b65; --green-soft:#eaf4ef;
      --amber:#a96c20; --amber-soft:#fbf3e7; --shadow:0 10px 34px rgba(24,48,57,.065);
      --radius:20px;
    }
    [data-theme="dark"] {
      --bg:#111b21; --panel:#1a282f; --panel-soft:#202f37; --ink:#edf4f2;
      --muted:#acbdbd; --line:#34464e; --blue:#74b7eb; --blue-soft:#203b4e;
      --red:#f08085; --red-soft:#472d32; --green:#83c8a8; --green-soft:#263f37;
      --amber:#e1b469; --amber-soft:#44382b; --shadow:0 12px 34px rgba(0,0,0,.20);
    }
    * {box-sizing:border-box}
    body {margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Times New Roman",Times,serif}
    button,input,select {font:inherit}
    button {color:inherit}
    .shell {max-width:1160px;margin:auto;padding:22px 24px 54px}
    .topbar {display:flex;align-items:center;justify-content:space-between;gap:18px;margin:-22px -24px 18px;padding:16px 26px;background:var(--panel);border-bottom:1px solid var(--line)}
    .brand {display:flex;align-items:center;min-width:0}
    .logo-wrap {background:var(--panel);display:flex;align-items:center;justify-content:flex-start;width:220px;max-width:34vw;overflow:hidden}
    .logo {display:block;width:100%;height:auto}
    [data-theme="dark"] .logo-wrap {background:#fff;border-radius:10px;padding:5px 8px}
    [data-theme="dark"] .logo {mix-blend-mode:normal}
    .top-actions {display:flex;align-items:center;gap:9px}
    .quiet-btn,.lang-btn {border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 12px;font-weight:700;cursor:pointer}
    .quiet-btn:hover,.lang-btn:hover {border-color:var(--blue)}
    .install-btn {background:var(--blue-soft);color:var(--blue);border-color:transparent}
    [hidden] {display:none!important}
    .language-switch {display:flex;align-items:center;gap:3px;border:1px solid var(--line);background:var(--panel-soft);border-radius:12px;padding:3px}
    .language-switch .lang-btn {border:0;background:transparent;border-radius:8px;min-width:40px;padding:6px 9px}
    .language-switch .lang-btn[aria-pressed="true"] {background:var(--blue);color:var(--panel)}
    .hero {display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:25px 28px;margin-bottom:20px;border-radius:24px;background:linear-gradient(117deg,#eaf1ee 0%,#e5eef1 54%,#edf1f7 100%);color:#20313d}
    [data-theme="dark"] .hero {background:linear-gradient(117deg,#20322f 0%,#20343c 54%,#293443 100%);color:var(--ink)}
    .hero-copy {max-width:720px}
    .eyebrow {font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#5d7881;margin-bottom:7px}
    [data-theme="dark"] .eyebrow {color:#abc6c6}
    .hero h1 {font-size:clamp(1.8rem,3.5vw,2.65rem);line-height:1.12;letter-spacing:-.035em;margin:0 0 9px}
    .hero p {margin:0;color:#526773;max-width:650px}
    [data-theme="dark"] .hero p {color:#cad8d8}
    .hero-badge {flex:0 0 auto;border:1px solid rgba(69,103,113,.2);background:rgba(255,255,255,.58);padding:10px 14px;border-radius:14px;font-weight:800;color:#405c67;font-size:.9rem}

    /* Traknus red-and-navy hero with a real forklift photo */
    .hero {position:relative;overflow:hidden;align-items:center;min-height:218px;padding:28px 30px;background:linear-gradient(112deg,#111e4d 0%,#233c78 61%,#d71927 61%,#c51424 100%);color:#fff}
    .hero:after {content:"";position:absolute;right:29%;top:-28%;width:20%;height:160%;background:rgba(255,255,255,.08);transform:skewX(-34deg);pointer-events:none}
    [data-theme="dark"] .hero {background:linear-gradient(112deg,#111e4d 0%,#233c78 61%,#d71927 61%,#c51424 100%);color:#fff}
    .hero-copy {position:relative;z-index:1;max-width:58%}
    .hero h1 {color:#fff;font-size:clamp(1.8rem,3.5vw,2.7rem);letter-spacing:0}
    .hero p,[data-theme="dark"] .hero p {color:#e0e8fa}
    .hero-machine {position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:min(34%,340px);height:160px;padding:0;background:transparent;border-radius:0;box-shadow:none}
    .hero-forklift {display:block;width:100%;height:100%;object-fit:contain}
    .customer-block {margin:22px 0 18px;padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--panel-soft)}
    .customer-block h3 {margin:0 0 4px}
    .customer-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:13px}
    .customer-grid .field {min-width:0}
    .customer-result-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
    .customer-result-item {padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-soft);min-width:0}
    .customer-result-item span {display:block;color:var(--muted);font-size:.82rem}
    .customer-result-item strong {display:block;margin-top:4px;overflow-wrap:anywhere}
    .result-truck {display:flex;align-items:center;gap:12px}
    .result-truck img {width:92px;height:68px;object-fit:contain;flex:0 0 92px}
    .result-truck .stat-label {margin-bottom:7px}
    .customer-error {color:#ad272f;font-weight:700;margin-top:10px}
    .type-card {min-height:118px}
    .truck-photo-wrap {display:flex;align-items:center;justify-content:center;flex:0 0 112px;width:112px;height:86px;overflow:visible;border-radius:0;background:transparent}
    .truck-photo {width:100%;height:100%;object-fit:contain}
    @media (max-width:760px) {
      .hero {flex-direction:row;align-items:center;padding:19px;min-height:158px;gap:12px}
      .hero-copy {max-width:62%}
      .hero-machine {width:35%;height:105px;padding:0}
      .customer-grid {grid-template-columns:1fr}
      .customer-result-grid {grid-template-columns:1fr}
      .type-card {min-height:102px}
      .truck-photo-wrap {flex-basis:83px;width:83px;height:70px}
    }
    @media (max-width:480px) {
      .hero {padding:15px;gap:8px;min-height:142px}
      .hero h1 {font-size:1.5rem}
      .hero p {font-size:.84rem}
      .hero-machine {height:86px;width:34%}
      .type-card {padding:9px;gap:9px}
      .truck-photo-wrap {flex-basis:72px;width:72px;height:64px}
    }
    [data-theme="dark"] .hero-badge {background:rgba(255,255,255,.07);color:#d8e4e4;border-color:var(--line)}
    .progress {display:flex;align-items:center;gap:8px;margin:0 0 18px;color:var(--muted);font-size:.9rem;font-weight:700}
    .progress .step {display:flex;align-items:center;gap:8px}
    .step-num {width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);font-size:.78rem}
    .step.active {color:var(--ink)} .step.active .step-num {background:var(--blue);color:#fff}
    .progress-line {height:1px;width:38px;background:var(--line)}
    .panel {background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:17px}
    .panel-head {display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
    .panel h2 {font-size:1.2rem;line-height:1.25;margin:0 0 5px;letter-spacing:-.02em}
    .panel h3 {font-size:1rem;margin:0 0 7px}
    .sub {color:var(--muted);font-size:.92rem;margin:0}
    .eyebrow-small {font-size:.72rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
    .section-title {font-size:1.03rem;font-weight:800;margin:0 0 4px}
    .type-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .type-card {text-align:left;border:1px solid var(--line);background:var(--panel-soft);border-radius:17px;padding:15px;cursor:pointer;transition:.16s ease;display:flex;align-items:center;gap:15px;min-height:105px}
    .type-card:hover {transform:translateY(-1px);border-color:var(--blue);box-shadow:0 8px 20px rgba(34,104,167,.08)}
    .type-card.selected.cb {border:2px solid var(--red);background:var(--red-soft)}
    .type-card.selected.wh {border:2px solid var(--blue);background:var(--blue-soft)}
    .type-card.selected.tt {border:2px solid var(--green);background:var(--green-soft)}
    .truck-icon {width:88px;height:66px;flex:0 0 auto}
    .type-label {display:block;font-weight:850;font-size:1.1rem}
    .type-detail {display:block;font-size:.84rem;color:var(--muted);margin-top:3px}
    .inline-note {padding:12px 14px;background:var(--panel-soft);border:1px dashed var(--line);border-radius:13px;color:var(--muted);font-size:.9rem}
    .choice-row {display:flex;flex-wrap:wrap;gap:9px}
    .choice {border:1px solid var(--line);background:var(--panel-soft);border-radius:12px;padding:10px 14px;min-height:43px;font-weight:750;cursor:pointer;transition:.14s ease}
    .choice:hover {border-color:var(--blue)}
    .choice.selected {border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
    .choice.selected.red {border-color:var(--red);background:var(--red-soft);color:var(--red)}
    .choice.selected.blue {border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
    .model-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}

    function removeLogoBackground() {
      var img=document.querySelector(".logo");
      function cutout() {
        if(img.dataset.cutout==="done"||!img.naturalWidth)return;
        try {
          var canvas=document.createElement("canvas");
          canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
          var ctx=canvas.getContext("2d",{willReadFrequently:true});
          ctx.drawImage(img,0,0);
          var pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
          for(var i=0;i<pixels.data.length;i+=4){
            var r=pixels.data[i],g=pixels.data[i+1],b=pixels.data[i+2];
            if(Math.min(r,g,b)>244&&Math.max(r,g,b)-Math.min(r,g,b)<14)pixels.data[i+3]=0;
          }
          ctx.putImageData(pixels,0,0);
          img.dataset.cutout="done";
          img.src=canvas.toDataURL("image/png");
        } catch(e) {
          img.dataset.cutout="unavailable";
        }
      }
      if(img.complete)cutout();else img.addEventListener("load",cutout,{once:true});

    function ensureSchedule() {
      for(var i=0;i<state.shiftCount;i++) {
        if(!Number(state.shiftLengths[i])||Number(state.shiftLengths[i])<=0) state.shiftLengths[i]=state.workdayHours/state.shiftCount;
        if(!state.breaks[i]) state.breaks[i]=[{start:null,length:defaultBreakMinutes(i),charge:false}];
        if(!state.breaks[i].length) state.breaks[i].push({start:null,length:defaultBreakMinutes(i),charge:false});
      }
      state.breaks.length=state.shiftCount;
      state.shiftStarts.length=state.shiftCount;
      state.shiftLengths.length=state.shiftCount;
    }
    function shiftLength(i) { return Number(state.shiftLengths[i]||state.workdayHours/state.shiftCount); }
    function defaultBreakMinutes(i) { return Math.max(1,Math.round(Math.min(30,shiftLength(i)*60/3)/5)*5); }
    function totalShiftHours() {
      return state.shiftLengths.slice(0,state.shiftCount).reduce(function(sum,h){return sum+Number(h||0);},0);
    }
    function shiftStart(i) {
      if(i===0) return toMinute(state.shiftStarts[0]||state.firstStart);

      var candidate=state.shiftStarts[i]?toMinute(state.shiftStarts[i]):previousEnd;
      while(candidate<previousEnd) candidate+=1440;
      return candidate;
    }
    function breakStart(i,j) {
      var b=state.breaks[i][j];

 Nusantara","e.g. PT Traktor Nusantara")+'" value="'+esc(state.customer.company)+'"></div><div class="field"><label for="customerLocation">'+tr("Lokasi kerja","Work location")+'</label><input class="input" id="customerLocation" data-input="customer" data-field="location" autocomplete="address-level2" placeholder="'+tr("Kota atau lokasi site","City or site location")+'" value="'+esc(state.customer.location)+'"></div><div class="field"><label for="customerSalesperson">'+tr("Sales person","Salesperson")+'</label><input class="input" id="customerSalesperson" data-input="customer" data-field="salesperson" autocomplete="name" placeholder="'+tr("Nama sales person","Salesperson name")+'" value="'+esc(state.customer.salesperson)+'"></div></div>'+(state.customerError?'<div class="customer-error" role="alert">'+esc(state.customerError)+'</div>':'')+'</section><button class="primary" data-act="start">'+tr("Mulai simulasi","Start simulation")+' →</button></section>';

    function allConfigs() {
      return state.trucks.map(function(t,index){
        var spec=CATALOG.models.find(function(m){return m.model===t.model;});
        return {truck:t,spec:spec,index:index};
      }).filter(function(c){return c.truck.model&&c.spec;});
    }
    function simulate(config,battery) {
      var t=config.truck,spec=config.spec;
      var usable=battery.ah*(1-(battery.reserve_pct||0));
      var modeFactor=Number((spec.power_modes||{})[t.mode]||1);
      var draw=spec.en_ah_per_hour*modeFactor*CATALOG.intensity_factors[state.intensity]*CATALOG.lift_factors[state.lift];
      var charger=Number(t.charger===null?((spec.charger_options_a||[])[0]||0):t.charger);
      var chargeRate=Math.min(Number(battery.ah),charger)*Number(CATALOG.charge_efficiency||1);
      var windows=[];
      for(var i=0;i<state.shiftCount;i++) {
        var start=shiftStart(i);
        var end=start+shiftLength(i)*60;
        windows.push({start:start,end:end,shift:i});
      }
      var first=windows[0].start,last=windows.reduce(function(a,w){return Math.max(a,w.end);},0),step=Number(CATALOG.time_step_min||5);
      var breaks=[];
      for(var si=0;si<windows.length;si++) {
        var w=windows[si];
        state.breaks[si].forEach(function(b,j){
          var bs=breakStart(si,j);
          while(bs<w.start) bs+=1440;
          var len=Number(b.length||0);
          if(len>0) breaks.push({start:bs,end:bs+len,charge:!!b.charge});
        });
      }
      var timeline=[first];
      for(var m=first+step;m<last;m+=step) timeline.push(m);
      if(timeline[timeline.length-1]<last) timeline.push(last);
      var soc=usable,points=[];
      for(var p=0;p<timeline.length;p++) {
        var minute=timeline[p];
        if(p>0) {
          var pm=timeline[p-1],elapsed=(minute-pm)/60;
          var working=windows.some(function(w){return w.start<=pm&&pm<w.end;});
          var br=null;
          for(var bi=0;bi<breaks.length;bi++) if(breaks[bi].start<=pm&&pm<breaks[bi].end){br=breaks[bi];break;}
          if(working&&br===null) soc-=draw*elapsed;
          else if(working&&br&&br.charge&&chargeRate>0) soc+=chargeRate*elapsed;
          soc=Math.max(0,Math.min(usable,soc));
        }
        points.push({elapsed:(minute-first)/60,clock:fmtClock(minute),soc:usable?soc/usable*100:0,minute:minute});
      }
      var min=points.reduce(function(a,p){return Math.min(a,p.soc);},100),end=points[points.length-1].soc;
      var threshold=Number(CATALOG.soft_safety_pct||.10)*100;
      var soft=points.find(function(p){return p.soc<=threshold;});
      return {label:t.name+" · "+spec.model+" · "+fmtNum(battery.ah)+" Ah",truckName:t.name,model:spec.model,truckType:t.type,points:points,draw:draw,usable:usable,runtime:draw?usable/draw:0,min:min,end:end,chargeRate:chargeRate,threshold:threshold,soft:soft?soft.elapsed:null,depleted:min<=.01,battery:battery,index:config.index};
    }
    function chartSvg(results,forPrint) {
      var W=840,H=360,L=58,R=20,T=18,B=48,iw=W-L-R,ih=H-T-B;
      var max=0;
      for(var i=0;i<results.length;i++) max=Math.max(max,results[i].points[results[i].points.length-1].elapsed);
      max=Math.max(max,.25);
      var x=function(v){return L+iw*v/max;}, y=function(v){return T+ih*(100-v)/100;};
      var ink=forPrint?"#586a73":getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
      var line=forPrint?"#d8e0e0":getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
      var parts=['<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+tr("Grafik persentase sisa baterai sepanjang jadwal","Battery remaining percentage over the work schedule")+'">'];
      ensureSchedule();
      var base=shiftStart(0);
      for(var si=0;si<state.shiftCount;si++) state.breaks[si].forEach(function(b,j){
        var start=breakStart(si,j);
        while(start<shiftStart(si)) start+=1440;
        var elapsed=(start-base)/60,duration=Number(b.length||0)/60,end=elapsed+duration;
        if(duration<=0||end<=0||elapsed>=max)return;
        var x0=x(Math.max(0,elapsed)),x1=x(Math.min(max,end));
        if(x1-x0<1)return;
        var fill=b.charge?"#347b65":"#929fa3";
        var title=tr("Shift ","Shift ")+(si+1)+" · "+fmtClock(start)+"–"+fmtClock(start+Number(b.length||0))+" · "+(b.charge?tr("charging","charging"):tr("tidak charging","not charging"));
        parts.push('<g><title>'+esc(title)+'</title><rect x="'+x0.toFixed(1)+'" y="'+T+'" width="'+(x1-x0).toFixed(1)+'" height="'+ih+'" rx="3" fill="'+fill+'" opacity=".16"/></g>');
      });
      var reservePct=results.length?results[0].threshold:Number(CATALOG.soft_safety_pct||.10)*100;
      var reserveY=y(reservePct),reserveColor=forPrint?"#cf3740":getComputedStyle(document.documentElement).getPropertyValue("--red").trim();
      parts.push('<rect x="'+L+'" y="'+reserveY.toFixed(1)+'" width="'+iw+'" height="'+(y(0)-reserveY).toFixed(1)+'" fill="'+reserveColor+'" fill-opacity=".20"/>');
      for(var v=0;v<=100;v+=5){
        var major=v%10===0;
        parts.push('<line x1="'+L+'" y1="'+y(v)+'" x2="'+(W-R)+'" y2="'+y(v)+'" stroke="'+line+'" stroke-width="'+(major?"1":".7")+'" opacity="'+(major?".7":".34")+'"/><text x="'+(L-9)+'" y="'+(y(v)+3.5)+'" text-anchor="end" fill="'+ink+'" font-size="10">'+v+'%</text>');
      }
      var areaLabelY=Math.min(y(0)-5,reserveY+(y(0)-reserveY)/2+4);
      parts.push('<text x="'+(L+18)+'" y="'+areaLabelY.toFixed(1)+'" fill="'+(forPrint?"#8c343a":reserveColor)+'" font-size="11" font-style="italic">'+esc(tr("Area tidak direkomendasikan","Not recommended Area"))+'</text>');
      var wholeHours=Math.floor(max+1e-9),fractionalEnd=max-wholeHours>1e-6;
      var tightEnd=fractionalEnd&&x(max)-x(wholeHours)<44;
      for(var hour=0;hour<=wholeHours;hour++){
        var ev=hour,clock=fmtClock(base+ev*60),labelY=tightEnd&&hour===wholeHours?H-31:H-17;
        parts.push('<line x1="'+x(ev)+'" y1="'+T+'" x2="'+x(ev)+'" y2="'+(H-B)+'" stroke="'+line+'" stroke-width="1" opacity=".42"/><text x="'+x(ev)+'" y="'+labelY+'" text-anchor="middle" fill="'+ink+'" font-size="10">'+clock+'</text>');
      }
      if(fractionalEnd){
        var endClock=fmtClock(base+max*60);
        parts.push('<line x1="'+x(max)+'" y1="'+T+'" x2="'+x(max)+'" y2="'+(H-B)+'" stroke="'+line+'" stroke-width="1" opacity=".58"/><text x="'+x(max)+'" y="'+(H-17)+'" text-anchor="middle" fill="'+ink+'" font-size="10">'+endClock+'</text>');
      }
      results.forEach(function(r,idx){
        var color=resultColor(r),d=resultDash(r);
        var path=r.points.map(function(p,j){return (j?"L":"M")+x(p.elapsed).toFixed(1)+" "+y(p.soc).toFixed(1);}).join(" ");
        parts.push('<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" '+(d?'stroke-dasharray="'+d+'"':'')+'/>');
        var last=r.points[r.points.length-1];
        parts.push('<circle cx="'+x(last.elapsed)+'" cy="'+y(last.soc)+'" r="4.5" fill="'+color+'" stroke="var(--panel)" stroke-width="2"/>');
      });
      parts.push('</svg>');
      return parts.join("");
    }
    function breakTimeline() {

ows.join("")+'</tbody></table></section><section><h2>'+tr("Perbandingan unit dan baterai","Truck and battery comparison")+'</h2><table class="print-table"><thead><tr><th>'+tr("Unit / model","Unit / model")+'</th><th>'+tr("Truck Mode","Truck mode")+'</th><th>'+tr("Baterai","Battery")+'</th><th>'+tr("Sisa setelah jadwal","Remaining after schedule")+'</th><th>'+tr("Waktu jalan terus-menerus*","Continuous runtime*")+'</th></tr></thead><tbody>'+resultRows+'</tbody></table></section><section class="print-chart"><h2>'+tr("Sisa baterai sepanjang jadwal","Battery level through the schedule")+'</h2><div class="chart-wrap">'+chartSvg(results,true)+'</div><div class="legend">'+results.map(function(r){return '<div class="legend-item"><span class="legend-line" style="border-color:'+resultColor(r)+';border-top-style:'+resultDashStyle(r)+'"></span>'+esc(r.label)+'</div>';}).join("")+'</div>'+breakTimeline()+'</section><p class="print-note">* '+tr("Waktu jalan terus-menerus adalah perkiraan bila unit bekerja tanpa istirahat atau charging. Persentase sisa di atas memperhitungkan jadwal istirahat dan charging yang dimasukkan. Hasil aktual dapat berbeda sesuai kondisi lapangan.","Continuous runtime estimates uninterrupted unit operation without breaks or charging. The remaining percentage reflects the breaks and charging entered above. Actual results may vary with operating conditions.")+'</p></article>';

      html+='<div class="chart-wrap">'+chartSvg(results)+'</div><p class="chart-scroll-note">'+tr("Geser grafik ke samping untuk melihat semua jam.","Swipe the chart sideways to see all hours.")+'</p><div class="legend">'+results.map(function(r){return '<div class="legend-item"><span class="legend-line" style="border-color:'+resultColor(r)+';border-top-style:'+resultDashStyle(r)+'"></span>'+esc(r.label)+'</div>';}).join("")+'</div>';
      html+='<p class="chart-caption">'+tr("Warna garis menandai forklift; pola garis membedakan kapasitas baterai.","Line colors identify forklifts; line patterns distinguish battery capacities.")+'</p>'+breakTimeline()+'</section>';
      html+='<section class="panel"><div class="panel-head"><div><h2>'+tr("Ringkasan tiap pilihan baterai","Summary for each battery option")+'</h2><p class="sub">'+tr("Lihat sisa baterai di akhir jadwal dan perkiraan waktu kerja nonstop.","See the remaining battery at the end of the schedule and estimated nonstop runtime.")+'</p></div></div><div class="stat-grid">'+results.map(function(r){return '<article class="stat"><div class="result-truck">'+modelPhotoHtml(r.model,"result-photo")+'<div><div class="stat-label">'+esc(r.truckName)+' · '+esc(typeLabel(r.truckType))+' · '+esc(r.model)+' · '+fmtNum(r.battery.ah)+' Ah</div><div class="stat-value">'+fmtNum(r.end)+'% <span style="font-size:.72rem;color:var(--muted)">'+tr("Sisa di akhir jadwal","remaining after schedule")+'</span></div><div class="sub" style="margin-top:6px">'+tr("Perkiraan kerja nonstop*","Estimated nonstop runtime*")+': <strong>'+fmtNum(r.runtime)+' '+tr("jam","hours")+'</strong></div></div></div></article>';}).join("")+'</div><p class="chart-caption">* '+tr("Perkiraan kerja nonstop tidak menghitung waktu istirahat atau charging.","Nonstop runtime does not include breaks or charging.")+'</p>';
      var low=results.some(function(r){return r.depleted||r.end<r.threshold;});
      if(low) html+='<div class="alert-box">'+tr("Ada pilihan baterai yang mencapai batas rendah sebelum jadwal selesai. Coba kapasitas lebih besar, kurangi intensitas, atau tambahkan charging saat istirahat.","At least one battery option reaches a low level before the schedule ends. Try a larger capacity, lower intensity, or charging during a break.")+'</div>';
      html+='<div class="button-row"><div><div class="sub">'+tr("Estimasi mengikuti faktor dari data model; kondisi lapangan dapat berbeda.","Estimates follow the model data; actual results may vary with operating conditions.")+'</div><div class="print-hint">'+tr("Pilih “Simpan sebagai PDF” pada jendela cetak.","Choose “Save as PDF” in the print window.")+'</div></div><div class="button-group"><button class="secondary" data-act="back-trucks">← '+tr("Ubah pilihan forklift","Edit forklift choices")+'</button><button class="primary" data-act="print">⌑ '+tr("Cetak / simpan PDF","Print / save PDF")+'</button></div></div></section>';
      html+=printReport(configs,results);
      return html;
    }
    function render() {
      setTheme();
      document.documentElement.lang=state.lang;
      document.getElementById("heroTitle").textContent=state.screen==="welcome"?tr("Perkirakan waktu kerja baterai","Estimate battery runtime"):tr("Simulator Waktu Operasional Baterai","Battery Runtime Simulator");
      document.getElementById("heroSub").textContent=state.screen==="welcome"?tr("Rencanakan baterai forklift dengan jadwal kerja yang mudah dipahami.","Plan forklift batteries with an easy-to-understand work schedule."):tr("Lihat perkiraan baterai untuk unit dan jadwal kerja yang kamu pilih.","Estimate battery runtime for the selected unit and work schedule.");
      var heroTruck=state.trucks[0],heroMachine=document.querySelector(".hero-machine");
      if(heroTruck&&heroTruck.model) heroMachine.innerHTML=modelPhotoHtml(heroTruck.model,"hero-forklift");
      else {var heroType=heroTruck&&heroTruck.type?heroTruck.type:"CB",heroPath=typeImagePath(heroType);heroMachine.innerHTML='<img class="hero-forklift" src="'+heroPath+'" alt="'+esc(typeLabel(heroType))+'">';}
      document.querySelectorAll(".language-switch [data-lang]").forEach(function(button){button.setAttribute("aria-pressed",String(button.dataset.lang===state.lang));});
      document.getElementById("themeButton").textContent=state.theme==="dark"?"☼":"◐";
      document.getElementById("themeButton").setAttribute("aria-label",tr("Ganti tema","Toggle color theme"));
      app.innerHTML=state.screen==="welcome"?welcomeScreen():
        (state.screen==="conditions"?conditionsScreen():
        (state.screen==="schedule"?scheduleScreen():
        (state.screen==="trucks"?truckScreen():analysisScreen())));
    }
    function validSetup() {
      var configs=state.trucks;
      for(var i=0;i<configs.length;i++){
        if(!configs[i].type||!configs[i].series||!configs[i].model) return tr("Lengkapi tipe, seri, dan model truk.","Complete the truck type, series, and model.");
        if(!configs[i].batteries.length) return tr("Pilih minimal satu kapasitas baterai.","Select at least one battery capacity.");
      }
      return "";
    }
    app.addEventListener("click",function(e){
      var b=e.target.closest("[data-act]"); if(!b) return;
      var act=b.dataset.act,slot=b.dataset.slot,index=slot?Number(slot.slice(1))-1:0,t=state.trucks[index]||state.trucks[0];
      if(act==="type"){t.type=b.dataset.value;t.series=null;t.model=null;t.batteries=[];t.charger=null;t.mode="Standard";}
      else if(act==="series"){t.series=b.dataset.value;t.model=null;t.batteries=[];t.charger=null;}
      else if(act==="model"){t.model=b.dataset.value;var spec=CATALOG.models.find(function(m){return m.model===t.model;});t.batteries=(spec.battery_options||[]).map(function(x){return x.ah;});t.charger=(spec.charger_options_a||[])[0]||0;if(!Object.keys(spec.power_modes||{}).includes(t.mode))t.mode="Standard";}
      else if(act==="battery"){var ah=Number(b.dataset.value);t.batteries=t.batteries.indexOf(ah)>=0?t.batteries.filter(function(x){return x!==ah;}):t.batteries.concat([ah]);}
      else if(act==="charger")t.charger=Number(b.dataset.value);
      else if(act==="mode")t.mode=b.dataset.value;
      else if(act==="add-truck"){if(state.trucks.length<6)state.trucks.push(newTruck("Unit "+(state.trucks.length+1)));}
      else if(act==="remove-truck"){var removeIndex=Number(b.dataset.index);if(removeIndex>0&&removeIndex<state.trucks.length){state.trucks.splice(removeIndex,1);state.trucks.forEach(function(unit,i){unit.name="Unit "+(i+1);});}}
      else if(act==="start"){if(!state.customer.company.trim()||!state.customer.location.trim()||!state.customer.salesperson.trim()){state.customerError=tr("Lengkapi nama perusahaan, lokasi kerja, dan sales person dulu.","Please enter the company, work location, and salesperson first.");}else{state.customerError="";state.screen="conditions";}}
      else if(act==="shift-minus")state.shiftCount=Math.max(1,state.shiftCount-1);
      else if(act==="shift-plus")state.shiftCount=Math.min(24,state.shiftCount+1);
      else if(act==="confirm-conditions"){
        var configKey=Number(state.workdayHours).toFixed(3)+"|"+state.shiftCount;
        if(state.scheduleConfigKey!==configKey){
          state.shiftLengths=Array.from({length:state.shiftCount},function(){return state.workdayHours/state.shiftCount;});
          state.shiftStarts=[];state.breaks=[];state.firstStart="08:00";state.scheduleConfigKey=configKey;
        }
        ensureSchedule();state.screen="schedule";
      }
      else if(act==="continue-trucks")state.screen="trucks";
      else if(act==="back-conditions")state.screen="conditions";
      else if(act==="back-schedule")state.screen="schedule";
      else if(act==="back-trucks")state.screen="trucks";
      else if(act==="add-break"){var si=Number(b.dataset.shift);state.breaks[si].push({start:null,length:defaultBreakMinutes(si),charge:false});}
      else if(act==="charge"){var si=Number(b.dataset.shift),bi=Number(b.dataset.break);state.breaks[si][bi].charge=b.dataset.value==="true";}
      else if(act==="intensity")state.intensity=b.dataset.value;
      else if(act==="lift")state.lift=b.dataset.value;
      else if(act==="start-over"){state= {screen:"welcome",lang:state.lang,theme:state.theme,customer:{company:"",location:"",salesperson:""},customerError:"",trucks:[newTruck("Unit 1")],workdayHours:8,shiftCount:1,shiftLengths:[],scheduleConfigKey:null,firstStart:"08:00",shiftStarts:[],breaks:[],intensity:"High",lift:"All"};}
      else if(act==="print"){window.print();return;}
      else if(act==="analyze"){var err=validSetup();if(err){var existing=document.getElementById("formError");if(existing)existing.remove();b.insertAdjacentHTML("afterend",'<span id="formError" class="error">'+esc(err)+'</span>');return;}state.screen="analysis";}
      render();
    });
    app.addEventListener("input",function(e){
      var el=e.target;if(el.dataset.input==="customer"){state.customer[el.dataset.field]=el.value;state.customerError="";}
    });
    app.addEventListener("change",function(e){
      var el=e.target,input=el.dataset.input;if(!input)return;
      if(input==="shift-count")state.shiftCount=Math.max(1,Math.min(24,parseInt(el.value,10)||1));
      else if(input==="workday-hours")state.workdayHours=Math.max(1,Math.min(24,Number(el.value)||8));
      else if(input==="shift-start"){var si=Number(el.dataset.shift);state.shiftStarts[si]=el.value;if(si===0)state.firstStart=el.value;for(var j=si+1;j<state.shiftCount;j++)state.shiftStarts[j]=null;}
      else if(input==="shift-length"){var si=Number(el.dataset.shift);state.shiftLengths[si]=Math.max(.01,Math.min(24,Number(el.value)||.01));for(var k=si+1;k<state.shiftCount;k++)state.shiftStarts[k]=null;}
      else if(input==="break-time"){var si=Number(el.dataset.shift),bi=Number(el.dataset.break);state.breaks[si][bi].start=el.value;}
      else if(input==="break-length"){var si=Number(el.dataset.shift),bi=Number(el.dataset.break);state.breaks[si][bi].length=Math.max(1,Math.min(1440,Number(el.value)||1));}
      render();
    });
    document.querySelectorAll(".language-switch [data-lang]").forEach(function(button){button.addEventListener("click",function(){state.lang=button.dataset.lang;safeStorage.setItem("traknus-lang",state.lang);updateInstallButton();render();});});
    document.getElementById("themeButton").addEventListener("click",function(){state.theme=state.theme==="dark"?"light":"dark";render();});
    window.addEventListener("beforeinstallprompt",function(event){event.preventDefault();deferredInstallPrompt=event;updateInstallButton();});
    window.addEventListener("appinstalled",function(){deferredInstallPrompt=null;installButton.hidden=true;});
    installButton.addEventListener("click",async function(){
      if(deferredInstallPrompt){var promptEvent=deferredInstallPrompt;deferredInstallPrompt=null;await promptEvent.prompt();updateInstallButton();return;}
      var help=state.lang==="id"
        ? "Android (Chrome): buka menu ⋮ lalu pilih Pasang aplikasi atau Tambahkan ke layar utama.\n\niPhone/iPad (Safari): tekan Bagikan lalu Tambahkan ke Layar Utama.\n\nLaptop (Chrome/Edge): pilih ikon Install di bilah alamat atau menu browser → Install page as app.\n\nKalau sedang membuka Streamlit, buka link GitHub Pages simulator dulu."
        : "Android (Chrome): open ⋮ and choose Install app or Add to Home screen.\n\niPhone/iPad (Safari): tap Share, then Add to Home Screen.\n\nLaptop (Chrome/Edge): use the Install icon in the address bar or browser menu → Install page as app.\n\nIf you opened the Streamlit link, first open the simulator's GitHub Pages link.";
      window.alert(help);
    });
    if("serviceWorker" in navigator) window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});
    removeLogoBackground();
    var embeddedCatalog=document.getElementById("traknus-catalog");var catalogLoad=embeddedCatalog?Promise.resolve(JSON.parse(embeddedCatalog.textContent)):fetch("catalog.json").then(function(r){if(!r.ok)throw new Error("catalog");return r.json();});catalogLoad.then(function(data){CATALOG=data;render();}).catch(function(){app.innerHTML='<section class="panel"><h2>'+tr("Data katalog belum termuat.","Model catalog did not load.")+'</h2><p class="sub">catalog.json</p></section>';});
  </script>
</body>
</html>
